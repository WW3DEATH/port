<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — NEXUS Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif'],display:['Oswald','sans-serif']},colors:{neon:{cyan:'#00F0FF',purple:'#A855F7',pink:'#EC4899',blue:'#3B82F6'},dark:{900:'#030712',800:'#0A0F1E',700:'#111827',600:'#1E293B'}}}}}</script>
</head>
<body class="noise grid-bg">
  <canvas id="particles-canvas"></canvas>
  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-500">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon-cyan to-neon-purple flex items-center justify-center font-display font-bold text-sm">N</div><span class="font-display text-xl font-semibold tracking-tight">NEXUS</span></a>
      <div class="hidden md:flex items-center gap-8">
        <a href="index.html" class="nav-link text-sm text-neutral-400 hover:text-neon-cyan transition-colors">Home</a>
        <a href="creations.html" class="nav-link text-sm text-neutral-400 hover:text-neon-cyan transition-colors">Creations</a>
        <a href="admin-messages.html" class="nav-link text-sm text-neutral-400 hover:text-neon-cyan transition-colors">Messages</a>
      </div>
      <div id="nav-actions" class="flex items-center gap-3"></div>
    </div>
    <div id="mobile-menu" class="md:hidden hidden px-6 pb-6 space-y-3">
      <a href="index.html" class="block py-2 text-sm text-neutral-400 hover:text-neon-cyan">Home</a>
      <a href="creations.html" class="block py-2 text-sm text-neutral-400 hover:text-neon-cyan">Creations</a>
      <a href="admin-messages.html" class="block py-2 text-sm text-neutral-400 hover:text-neon-cyan">Messages</a>
    </div>
  </nav>

  <!-- Admin content (hidden until auth check) -->
  <section id="messages-content" class="page-section relative z-10 py-24 px-6 hidden">
    <div class="max-w-4xl mx-auto">
      <div class="reveal flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
        <div>
          <span class="text-xs font-bold tracking-[0.2em] uppercase text-neon-cyan mb-2 block">Admin Panel</span>
          <h2 class="font-display text-4xl sm:text-5xl font-bold tracking-tight uppercase leading-[0.95]">Inbox <span class="glow-text">Messages</span></h2>
        </div>
        <div class="flex items-center gap-3">
          <div id="unread-badge" class="items-center justify-center px-3 py-1.5 rounded-xl bg-neon-cyan/10 border border-neon-cyan/30 text-neon-cyan text-sm font-bold" style="display:none">0</div>
          <button onclick="markAllRead()" class="flex items-center gap-2 px-4 py-2 rounded-xl border border-white/10 text-neutral-400 text-sm font-semibold hover:text-white hover:border-white/20 transition-all">
            <i data-lucide="check-check" class="w-4 h-4"></i> Mark All Read
          </button>
        </div>
      </div>
      <div id="messages-list"></div>
    </div>
  </section>

  <!-- Access denied -->
  <section id="access-denied" class="page-section relative z-10 py-24 px-6 hidden">
    <div class="max-w-md mx-auto text-center">
      <div class="w-20 h-20 rounded-full bg-red-500/10 flex items-center justify-center mx-auto mb-6">
        <i data-lucide="shield-alert" class="w-10 h-10 text-red-400"></i>
      </div>
      <h2 class="font-display text-3xl font-bold uppercase tracking-tight mb-4">Access Denied</h2>
      <p class="text-neutral-500 mb-8">You need to be logged in as an admin to view messages.</p>
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <button onclick="openAuthModal('login')" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-neon-cyan to-neon-blue text-dark-900 font-bold text-sm tracking-wider uppercase">
          <i data-lucide="log-in" class="w-4 h-4"></i> Login
        </button>
        <a href="index.html" class="flex items-center gap-2 px-6 py-3 rounded-xl border border-white/10 text-neutral-400 font-semibold text-sm tracking-wider uppercase hover:text-white hover:border-white/20 transition-all">
          <i data-lucide="home" class="w-4 h-4"></i> Home
        </a>
      </div>
    </div>
  </section>

  <div id="auth-modal" class="modal-overlay" onclick="closeAuthModal(event)">
    <div class="modal-content w-full max-w-md mx-4 glow-border p-8" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-6"><h3 class="font-display text-2xl font-bold uppercase tracking-tight">Account</h3><button onclick="closeAuthModal()" class="w-10 h-10 rounded-xl border border-white/10 flex items-center justify-center text-neutral-500 hover:text-white transition-all"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="flex gap-2 p-1 rounded-xl bg-white/5 mb-6"><button class="auth-tab active-tab flex-1" data-tab="login" onclick="switchAuthTab('login')">Sign In</button><button class="auth-tab flex-1" data-tab="signup" onclick="switchAuthTab('signup')">Sign Up</button></div>
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div id="auth-signup-fields" class="hidden"><label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Full Name</label><input type="text" id="auth-name" placeholder="John Doe" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-neutral-600 focus:outline-none focus:border-neon-cyan/40 transition-all"></div>
        <div><label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Email</label><input type="email" id="auth-email" required placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-neutral-600 focus:outline-none focus:border-neon-cyan/40 transition-all"></div>
        <div><label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Password</label><input type="password" id="auth-password" required minlength="6" placeholder="Min 6 characters" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-neutral-600 focus:outline-none focus:border-neon-cyan/40 transition-all"></div>
        <p id="auth-error" class="text-red-400 text-sm min-h-[1.25rem]"></p>
        <button type="submit" id="auth-submit-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-neon-cyan to-neon-blue text-dark-900 font-bold text-sm tracking-wider uppercase hover:shadow-[0_0_30px_rgba(0,240,255,0.3)] transition-all">Sign In</button>
      </form>
    </div>
  </div>

  <footer class="relative z-10 border-t border-white/5 py-12 px-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
      <a href="index.html" class="flex items-center gap-2"><div class="w-7 h-7 rounded-lg bg-gradient-to-br from-neon-cyan to-neon-purple flex items-center justify-center font-display font-bold text-xs">N</div><span class="font-display text-lg font-semibold">NEXUS</span></a>
      <p class="text-neutral-600 text-sm">© 2025 NEXUS Portfolio.</p>
    </div>
  </footer>
  <div id="toast" class="toast flex items-center gap-3"><div id="toast-icon" class="w-8 h-8 rounded-lg flex items-center justify-center"></div><span id="toast-text" class="text-sm font-medium"></span></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
